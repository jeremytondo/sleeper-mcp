services:
  sleeper-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SLEEPER_USER_ID: ${SLEEPER_USER_ID}
      MCP_MAX_CONCURRENT_REQUESTS: 8
      MCP_MAX_REQUESTS_PER_MINUTE: 60
      SLEEPER_REQUEST_TIMEOUT_MS: 5000
      SLEEPER_PLAYER_CACHE_TTL_MS: 86400000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.12
    restart: unless-stopped
    depends_on:
      sleeper-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://sleeper-mcp:3000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json

